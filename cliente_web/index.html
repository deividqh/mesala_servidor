    <div class="offcanvas-body">

      <!-- Tabs personalizadas -->
      <div class="custom-tabs">
          <ul class="nav nav-tabs config-tabs" role="tablist" aria-label="Secciones de configuración">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="config-salon-tab" data-bs-toggle="tab" data-bs-target="#config-salon" type="button" role="tab" aria-controls="config-salon" aria-selected="true">Salón</button>
          </li>
          <li class="nav-item" role="presentation">

        </ul>

        <div class="tab-content config-tab-content">


          <!-- ■■■■■ Contenido ■■■■■ -->
          <div class="tab-pane fade show active tab-content-custom" id="config-salon" role="tabpanel" aria-labelledby="config-salon-tab" tabindex="0"></div>
            
            <!-- ┌•••••••••••••• -->
            <!-- ┌•• Formulario  -->
              <form id="form_config_salon">
                <section class="config-section config-section--sidebar" aria-labelledby="config_sidebar_title">

                    <span id="config_sidebar_title" class="options-bar__label">Posición del sidebar de elementos</span>
                    <label class="sidebar-position-switch" aria-label="Cambiar posición del sidebar">

                      <input type="checkbox" data-side-position-toggle checked>
                      <span class="sidebar-position-switch__slider" aria-hidden="true"></span>
                      <span>Dcha.</span>
                    </label>
                  </div>
                </section>

                <section class="config-section" aria-label="Datos del salón">
                  <label for="config_nombre_salon">Nombre Salón</label>
                  <input id="config_nombre_salon" type="text" name="nombre" placeholder="Ej: Mi Salón" readonly>
                  <div class="form-group-header">
                    <label for="config_columnas">Número Columnas</label>
                    <div class="config-info" data-config-info="columnas"></div>
                  </div>
                  <input id="config_columnas" type="text" name="columnas" placeholder="Ej: 4" readonly>
                  
                  <div class="form-group-header">
                      <label for="config_filas">Número Filas</label>
                      <div class="config-info" data-config-info="filas"></div>
                  </div>
                  <input id="config_filas" type="text" name="filas" placeholder="Ej: 3" readonly>
                </section>

                <!-- <button type="submit">Guardar</button> -->
                <div class="config-actions">
                  <button type="submit" disabled aria-disabled="true">Guardar</button>
                </div>

              </form>
          </div>

          <div class="tab-pane fade tab-content-custom" id="config-players" role="tabpanel" aria-labelledby="config-players-tab" tabindex="0">

            <section class="config-section config-section--catalogo" aria-labelledby="config_players_catalogo_title">

  <!-- 
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
  OFFCANVAS CU - Create/Update  ■■■■■
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
  -->
   <div class="offcanvas offcanvas-start" id="offcanvas_cu" data-offcanvas-cu="root" tabindex="-1" aria-labelledby="etiqueta_offcanvas_cu">
      <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="etiqueta_offcanvas_cu" data-offcanvas-cu="titulares">📸 Guardar Foto del Salón Activo</h5>
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>

      <div class="offcanvas-body" data-offcanvas-cu="contenedor-formulario">

        <form id="form_guardar_foto" class="small" data-offcanvas-cu="formulario">
          
          <div class="alert d-none" role="alert" data-offcanvas-cu="feedback">FeedBack</div>
          
          <div class="accordion accordion-flush" data-offcanvas-cu="acordeon">
              <div class="accordion-item">
                  <h3 class="accordion-header">
                      <button class="accordion-button collapsed " type="button" data-bs-toggle="collapse" data-bs-target="#acordeon_reservas" aria-expanded="false" aria-controls="acordeon_reservas">
                        Reservas
                      </button>
                  </h3>
                  <div id="acordeon_reservas" class="accordion-collapse collapse">
                      <div class="accordion-body " data-offcanvas-cu="acordeon-reservas"></div>
                  </div>
              </div>
              <div class="accordion-item">
                  <h3 class="accordion-header">
                      <button class="accordion-button collapsed " type="button" data-bs-toggle="collapse" data-bs-target="#acordeon_mensajes" aria-expanded="false" aria-controls="acordeon_mensajes">
                        Mensajes
                      </button>
                  </h3>
                  <div id="acordeon_mensajes" class="accordion-collapse collapse">
                      <div class="accordion-body " data-offcanvas-cu="acordeon-mensajes"></div>
                  </div>
              </div>
              <div class="accordion-item">
                  <h2 class="accordion-header">
                      <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#acordeon_alergias" aria-expanded="false" aria-controls="acordeon_alergias">
                        Alergias
                      </button>
                  </h2>
                  <div id="acordeon_alergias" class="accordion-collapse collapse">
                      <div class="accordion-body py-2" data-offcanvas-cu="acordeon-alergias"></div>
                  </div>
              </div>
          </div>

          <div class="mb-2">
              <div class="d-flex justify-content-between align-items-center">
                  <label for="foto_titulo" class="form-label mb-1 text-black-50">Título</label>
                  <label class="form-label mb-1 text-black-50" data-dimension="dimension">Dimension</label>
              </div>
              
              <input id="foto_titulo" type="text" class="form-control form-control-sm" data-offcanvas-cu="titulo" required>
          </div>

          <div class="mb-2">
              <label for="foto_slug_publico" class="form-label mb-1 text-black-25">Slug público</label>
              <input id="foto_slug_publico" type="text" class="form-control form-control-sm text-black-50" data-offcanvas-cu="slug">
          </div>

          <div class="mb-2">
              <label for="foto_mensaje_publico" class="form-label mb-1 text-black-50">Descripción (opcional)</label>
              <textarea id="foto_mensaje_publico" class="form-control form-control-sm" rows="2" data-offcanvas-cu="mensaje"></textarea>
          </div>

          <div class="form-check mb-2">
              <input id="foto_es_plantilla" class="form-check-input" type="checkbox" data-offcanvas-cu="plantilla">
              <label class="form-check-label text-black-50" for="foto_es_plantilla">Es plantilla ( Copia Única... se Replica )</label>
          </div>

          <div class="form-check mb-3">
              <input id="foto_es_publica" class="form-check-input" type="checkbox" data-offcanvas-cu="publica">
              <label class="form-check-label text-black-50" for="foto_es_publica">Es pública ( ⚠️ Sin Uso de Momento)</label>
          </div>

        </form>
      </div>
      <div class="offcanvas-footer">
          <button type="submit" form="form_guardar_foto" class="btn btn-primary btn-sm w-100" data-offcanvas-cu="submit">Guardar</button>
      </div>    

  </div> 


<!-- 
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
  Offcanvas RUD - Load Foto ■■■■■■■■■
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
-->
  <div id="offcanvas_RUD" class="offcanvas offcanvas-end" tabindex="-1" aria-labelledby="load_Label" data-rud="offcanvas">
      <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="load_Label" data-rud="titulares">📝 Listado de •Fichas• de Foto.</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close" data-rud="cerrar"></button>
      </div>  
      <div class="visibilidad-card-rud p-4 shadow-sm">
      <!-- 
        Cabecera: selector del tipo de filtro 
        -->
      <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="text-uppercase fw-bold text-muted text-tracking">VISIBILIDAD</span>

          <div class="segmented-control-rud" role="radiogroup">
              <input type="radio" class="btn-check" name="filtro" id="radio-todos" value="todos" checked>
              <label class="btn" for="radio-todos">Todos</label>

              <input type="radio" class="btn-check" name="filtro" id="radio-custom" value="custom">
              <label class="btn" for="radio-custom">Personalizado</label>
          </div>
      </div>

      <!-- 
      Opciones del filtro personalizado 
      -->
      <div id="opciones-personalizadas" class="d-flex flex-wrap gap-2 mb-1" style="transition: opacity 0.3s ease;">
          <div class="chip-rud chip-plantilla-rud" data-visibilidad="plantilla">
              <input type="checkbox" class="btn-check" id="check-plantilla" name="es_plantilla">
              <label class="btn" for="check-plantilla">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                  </svg>
                  Plantilla
              </label>
          </div>

          <div class="chip-rud chip-publica-rud" data-visibilidad="publica">
              <input type="checkbox" class="btn-check" id="check-publica" name="es_publica">
              <label class="btn" for="check-publica">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                  </svg>
                  Pública
              </label>
          </div>
      </div>

      <div class="pt-1 border-top mt-1">
          <small id="status-display" class="text-muted fst-italic" style="font-size: 0.65rem;">
              Mostrando todos los elementos.
          </small>
      </div>
    </div>
    <!-- 
      
    -->
    <div class="offcanvas-body">
        <div id="feedback_RUD" class="alert d-none" role="alert" data-rud="feedback"></div>
        <div id="contenedor_RUD" data-rud="contenedor_lista"></div>

        <template data-rud-template="registro">
            <div class="photo-registro-rud">
                <div class="photo-info-section" data-rud-field="info" data-bs-toggle="tooltip">
                    <div class="d-flex align-items-center gap-2">
                        <span data-rud-field="visibilidad"></span>
                        <span class="photo-titulo-rud" data-rud-field="titulo"></span>
                    </div>
                    <span class="photo-fecha-rud" data-rud-field="fecha"></span>
                </div>

                <div class="photo-actions-section">
                    <button type="button" class="photo-btn-accion-rud" data-rud-action="cargar" title="Cargar salón" data-bs-toggle="tooltip">
                        <i class="bi bi-play-circle-fill"></i>
                    </button>
                    <button type="button" class="photo-btn-accion-rud" data-rud-action="eliminar" title="Eliminar salón" data-bs-toggle="tooltip">
                        <i class="bi bi-trash3"></i>
                    </button>
                    <button type="button" class="photo-btn-accion-rud" data-rud-action="actualizar" title="Actualizar salón" data-bs-toggle="tooltip">
                        <i class="bi bi-arrow-repeat"></i>
                    </button>
                </div>
            </div>
        </template>

        <template data-rud-template="vacio">
            <div class="text-white-50 p-3 text-center">Aún no has guardado ningún salón.</div>
        </template>
    </div>
        
  </div>

  <!--   
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
  Modal UPDATE de una ficha de foto. ■■■■■■■■
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
    La estructura es estática para que el formulario sea fácil de localizar y
    mantener. JavaScript únicamente carga los datos y abre la ventana.
  -->
  <div class="modal fade" id="modal_update_ficha" tabindex="-1" aria-labelledby="modal_update_ficha_titulo" aria-hidden="true" data-updt="update">
      <div class="modal-dialog modal-lg">
          <div class="modal-content">
              <div class="modal-header" data-updt="header">
                  <h5 class="modal-title" id="modal_update_ficha_titulo" data-updt="titulo-modal">Actualizar Ficha 🗃️ del Salón:</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
              </div>

              <div class="update-body">
                  <div class="alert alert-danger d-none p-2 small mb-3" role="alert" data-updt="feedback"></div>

                  <div class="update-body" data-updt="contenedor-formulario">
                      
                      <!-- FORMULARIO -->
                      <form id="form_update_foto" class="small" data-updt="formulario">
                          <div class="mb-2">
                              <span class="form-label mb-1 text-black-50" data-updt="dimension"></span>
                          </div>

                          <div class="mb-2">
                              <label for="update_foto_titulo" class="form-label mb-1 text-black-50">Título</label>
                              <input id="update_foto_titulo" type="text" class="form-control form-control-sm" data-updt="titulo" required>
                          </div>

                          <div class="mb-2">
                              <label for="update_foto_slug_publico" class="form-label mb-1 text-black-25">Slug público</label>
                              <input id="update_foto_slug_publico" type="text" class="form-control form-control-sm text-black-50" data-updt="slug">
                          </div>

                          <div class="mb-2">
                              <label for="update_foto_mensaje_publico" class="form-label mb-1 text-black-50">Descripción (opcional)</label>
                              <textarea id="update_foto_mensaje_publico" class="form-control form-control-sm" rows="2" data-updt="mensaje"></textarea>
                          </div>

                          <div class="form-check mb-2">
                              <input id="update_foto_es_plantilla" class="form-check-input" type="checkbox" data-updt="plantilla">
                              <label class="form-check-label text-black-50" for="update_foto_es_plantilla">Es plantilla (copia única que se replica)</label>
                          </div>

                          <div class="form-check mb-3">
                              <input id="update_foto_es_publica" class="form-check-input" type="checkbox" data-updt="publica">
                              <label class="form-check-label text-black-50" for="update_foto_es_publica">Es pública (sin uso de momento)</label>
                          </div>
                      </form>

                  </div>
              </div>

              <div class="modal-footer">
                  <button type="submit" data-updt="submit" form="form_update_foto" class="btn btn-primary btn-sm w-100">Actualizar Ficha</button>
