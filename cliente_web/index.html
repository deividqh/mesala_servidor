  <!-- 
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
  Offcanvas CONFIGURACION ■■■■■■■■■■■
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
  -->
  <div class="offcanvas offcanvas-end off-config" tabindex="-1" id="offcanvas_configuracion" data-tipo-bs="offcanvas-configuracion">
    <div class="offcanvas-header">
      <!-- <i class="bi bi-cup-hot me-2"></i> -->
      ⚙️ Configuración - davidquesadaheredia@gmail.com
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar menú"></button>
    </div>
    <div class="offcanvas-body">

      <!-- Pestañas de configuración -->
      <div class="custom-tabs">
          <ul class="nav nav-tabs config-tabs" role="tablist" aria-label="Secciones de configuración">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="config-tab" data-bs-toggle="tab" data-bs-target="#config" type="button" role="tab" aria-controls="config" aria-selected="true">Config</button>
          </li>
          <li class="nav-item" role="presentation">
             <button class="nav-link" id="foto-actual-tab" data-bs-toggle="tab" data-bs-target="#foto-actual" type="button" role="tab" aria-controls="foto-actual" aria-selected="false">Foto Actual</button>
          </li>
        </ul>

        <div class="tab-content config-tab-content">


          <div class="tab-pane fade show active tab-content-custom" id="config" role="tabpanel" aria-labelledby="config-tab" tabindex="0">
            
            <!-- ┌•••••••••••••• -->
            <!-- ┌•• Formulario  -->
              <form id="form_config_salon">
                <section class="config-section config-section--sidebar" aria-labelledby="config_sidebar_title">
                  <div class="config-section__header">
                    <span id="config_sidebar_title" class="options-bar__label">Posición del sidebar de elementos</span>
                    <label class="sidebar-position-switch" aria-label="Cambiar posición del sidebar">
                      <span>Izq.</span>
                      <input type="checkbox" data-side-position-toggle checked>
                      <span class="sidebar-position-switch__slider" aria-hidden="true"></span>
                      <span>Dcha.</span>
                    </label>
                  </div>
                </section>

                <section class="config-section" aria-label="Datos del salón">
                  <label for="config_nombre_salon">Nombre Salón</label>
                  <input id="config_nombre_salon" type="text" name="nombre" placeholder="Ej: Mi Salón" readonly>
                  <div class="form-group-header">
                    <label for="config_columnas">Número Columnas</label>
                    <div class="config-info" data-config-info="columnas"></div>
                  </div>
                  <input id="config_columnas" type="text" name="columnas" placeholder="Ej: 4" readonly>
                  
                  <div class="form-group-header">
                      <label for="config_filas">Número Filas</label>
                      <div class="config-info" data-config-info="filas"></div>
                  </div>
                  <input id="config_filas" type="text" name="filas" placeholder="Ej: 3" readonly>
                </section>

                <div class="config-actions">
                  <button type="submit" disabled aria-disabled="true">Guardar</button>
                </div>

              </form>
          

            <section class="config-section config-section--catalogo" aria-labelledby="config_players_catalogo_title">
              <h3 id="config_players_catalogo_title" class="config-section__title">Catálogo de elementos</h3>
              <div class="config-catalog-table-wrapper" data-config-catalogo-players></div>
            </section>

          </div>

          <div class="tab-pane fade tab-content-custom" id="foto-actual" role="tabpanel" aria-labelledby="foto-actual-tab" tabindex="0">
            <div data-config-foto-actual aria-live="polite"></div>
          </div>


        </div>

      </div>
      
      <div class="d-lg-none align-self-center py-3 social-icons-container">
          <!-- <a href="https://www.laforjadeprometeo.com/"> <i class="bi bi-twitter  px-2 text-info fs-2"></i></a> -->
          <a href="mailto:davidquesadaheredia@gmail.com" title="Enviar email"><i class="bi bi-envelope px-2 text-white fs-2"></i></a>
          <a href="https://www.laforjadeprometeo.com/" title="Ir a Facebook"> <i class="bi bi-facebook px-2 text-info fs-2"></i></a>
          <a href="https://www.github.com/" title="Ir a GitHub">   <i class="bi bi-github   px-2 text-info fs-2"></i></a>
          <a href="https://www.laforjadeprometeo.com/" title="Ir a WhatsApp"> <i class="bi bi-whatsapp px-2 text-info fs-2"></i></a>
      </div>
    </div>
  </div>  

  
  <!-- 
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
  OFFCANVAS CU - Create/Update  ■■■■■
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
  -->
   <div class="offcanvas offcanvas-start" id="offcanvas_cu" data-offcanvas-cu="root" tabindex="-1" aria-labelledby="etiqueta_offcanvas_cu">
      <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="etiqueta_offcanvas_cu" data-offcanvas-cu="titulares">
            📸 Guardar Foto del Salón
          </h5>
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>

      <div class="offcanvas-body" data-offcanvas-cu="contenedor-formulario">

        <form id="form_guardar_foto" class="small" data-offcanvas-cu="formulario">
          
          <div class="alert d-none" role="alert" data-offcanvas-cu="feedback">FeedBack</div>

          <div class="mb-3" data-offcanvas-cu="selector-accion">
              <!-- <span class="form-label d-block mb-2 text-black-50">¿Qué quieres hacer?</span> -->
              <div class="action-tabs" role="group" aria-label="Acción sobre la foto">
                  <input type="radio" class="btn-check" name="accion_foto" id="accion_crear_foto" value="crear" autocomplete="off">
                  <label class="action-tabs__tab" for="accion_crear_foto">Crear</label>

                  <input type="radio" class="btn-check" name="accion_foto" id="accion_actualizar_foto" value="actualizar" autocomplete="off">
                  <label class="action-tabs__tab" for="accion_actualizar_foto">Actualizar</label>

                  <input type="radio" class="btn-check" name="accion_foto" id="accion_copiar_foto" value="copiar" autocomplete="off">
                  <label class="action-tabs__tab" for="accion_copiar_foto">Crear Copia</label>
              </div>
              <p class="small text-body-secondary mb-0 mt-2" data-offcanvas-cu="ayuda-accion"></p>
          </div>
          
          <div class="accordion accordion-flush" data-offcanvas-cu="acordeon">
              <div class="accordion-item">
                  <h3 class="accordion-header">
                      <button class="accordion-button collapsed " type="button" data-bs-toggle="collapse" data-bs-target="#acordeon_reservas" aria-expanded="false" aria-controls="acordeon_reservas">
                        Reservas
                      </button>
                  </h3>
                  <div id="acordeon_reservas" class="accordion-collapse collapse">
                      <div class="accordion-body " data-offcanvas-cu="acordeon-reservas"></div>
                  </div>
              </div>
              <div class="accordion-item">
                  <h3 class="accordion-header">
                      <button class="accordion-button collapsed " type="button" data-bs-toggle="collapse" data-bs-target="#acordeon_mensajes" aria-expanded="false" aria-controls="acordeon_mensajes">
                        Mensajes
                      </button>
                  </h3>
                  <div id="acordeon_mensajes" class="accordion-collapse collapse">
                      <div class="accordion-body " data-offcanvas-cu="acordeon-mensajes"></div>
                  </div>
              </div>
              <div class="accordion-item">
                  <h2 class="accordion-header">
                      <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#acordeon_alergias" aria-expanded="false" aria-controls="acordeon_alergias">
                        Alergias
                      </button>
                  </h2>
                  <div id="acordeon_alergias" class="accordion-collapse collapse">
                      <div class="accordion-body py-2" data-offcanvas-cu="acordeon-alergias"></div>
                  </div>
              </div>
          </div>

          <div class="mb-2">
              <div class="d-flex justify-content-between align-items-center">
                  <label for="foto_titulo" class="form-label mb-1 text-black-50">Título</label>
                  <label class="form-label mb-1 text-black-50" data-dimension="dimension">Dimension</label>
              </div>
              
              <input id="foto_titulo" type="text" class="form-control form-control-sm" data-offcanvas-cu="titulo" required>
          </div>

          <input id="foto_slug" type="hidden" data-offcanvas-cu="slug">

          <div class="mb-3 descripcion-foto-cu">
              <label for="foto_mensaje" class="form-label mb-1 text-black-50">Descripción (opcional)</label>
              <textarea id="foto_mensaje" class="form-control form-control-sm" rows="3" data-offcanvas-cu="mensaje"></textarea>
          </div>
          <div class="form-check mb-2">
              <input id="foto_es_favorita" class="form-check-input" type="checkbox" data-offcanvas-cu="favorita">
              <label class="form-check-label text-black-50" for="foto_es_favorita">Marcar como favorita ⭐</label>
          </div>

          <div class="form-check mb-3">
              <input id="foto_es_cerrada" class="form-check-input" type="checkbox" data-offcanvas-cu="cerrada">
              <label class="form-check-label text-black-50" for="foto_es_cerrada">Foto cerrada 🔐</label>
          </div>

        </form>
      </div>
      <div class="offcanvas-footer">
          <button type="submit" form="form_guardar_foto" class="btn btn-primary btn-sm w-100" data-offcanvas-cu="submit">
            Crear Foto
          </button>
      </div>    

  </div> 


<!-- 
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
  Offcanvas RUD - Load Foto ■■■■■■■■■
  ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
-->
    <div id="offcanvas_RUD" class="offcanvas offcanvas-end" tabindex="-1" aria-labelledby="load_Label" data-rud="offcanvas">
      <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="load_Label" data-rud="titulares">📝 Listado de Fotos.</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close" data-rud="cerrar"></button>
      </div>  
      <div class="visibilidad-card-rud p-4 shadow-sm">
      <div class="filtro-activador-rud">
          <label for="activar-filtros-rud">Filtrar:</label>
          <input type="checkbox" id="activar-filtros-rud" role="switch" aria-controls="opciones-personalizadas">
           <span class="estado-filtros-rud" data-rud="estado-filtros" aria-live="polite">Filtros NO aplicados</span>
      </div>
      <!-- 
      Opciones del filtro personalizado 
      -->
      <div id="opciones-personalizadas" class="d-flex flex-wrap gap-2 mb-1 filtros-inactivos-rud">
          <div class="chip-rud chip-plantilla-rud" data-visibilidad="favorita">
              <input type="checkbox" class="btn-check" id="check-favorita" name="es_favorita">
              <label class="btn" for="check-favorita">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                  </svg>
                  Favoritas
              </label>
          </div>

          <div class="chip-rud chip-publica-rud" data-visibilidad="cerrada">
              <input type="checkbox" class="btn-check" id="check-cerrada" name="es_cerrada">
              <label class="btn" for="check-cerrada">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                  </svg>
                  Cerrada
              </label>
          </div>
      </div>

      
    </div>
    <!-- 
      
    -->
    <div class="offcanvas-body">
        <div id="feedback_RUD" class="alert d-none" role="alert" data-rud="feedback"></div>
        <div id="contenedor_RUD" data-rud="contenedor_lista"></div>

        <template data-rud-template="registro">
            <div class="photo-registro-rud">
                <div class="photo-info-section" data-rud-field="info" data-bs-toggle="tooltip">
                    <div class="d-flex align-items-center gap-2">
                        <span data-rud-field="visibilidad"></span>
                        <span class="photo-titulo-rud" data-rud-field="titulo"></span>
                    </div>
                    <span class="photo-fecha-rud" data-rud-field="fecha"></span>
                </div>

                <div class="photo-actions-section">
                    <button type="button" class="photo-btn-accion-rud" data-rud-action="cargar" title="Cargar salón" data-bs-toggle="tooltip">
                        <i class="bi bi-play-circle-fill"></i>
                    </button>
                    <button type="button" class="photo-btn-accion-rud" data-rud-action="eliminar" title="Eliminar salón" data-bs-toggle="tooltip">
                        <i class="bi bi-trash3"></i>
                    </button>
                </div>
            </div>
        </template>

        <template data-rud-template="vacio">
            <div class="text-white-50 p-3 text-center">No hay fotos que mostrar.</div>
        </template>
    </div>
        
  </div>

  
  
</body>
</html>
